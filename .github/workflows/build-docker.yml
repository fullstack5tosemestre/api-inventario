name: Build and publish to docker hub
on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "src/**"

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: build .jar file
        run: |
          chmod +x ./mvnw
          ./mvnw clean package

      - name: build image
        run: |
          docker build -t inventario:latest .
          docker tag inventario:latest ${{ secrets.ECR_REPO_URL_API_INVENTARIO }}:latest

      - name: Push API Inventario Image to ECR
        run: |
          docker push ${{ secrets.ECR_REPO_URL_API_INVENTARIO }}:latest

      - name: Create SSH Ke
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 400 key.pem

      - name: Deploy API Inventario to Private EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i key.pem \
          ec2-user@${{ secrets.EC2_API_GATEWAY_PUBLIC_IP }} \
          "ssh -o StrictHostKeyChecking=no \
          -i ~/DevOps.pem \
          ec2-user@${{ secrets.EC2_API_INVENTARIO_PRIVATE_IP }} \
          'aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 089485767547.dkr.ecr.us-east-1.amazonaws.com && \
          docker pull ${{ secrets.ECR_REPO_URL_API_INVENTARIO }}:latest && \
          docker rm -f db || true && \
          docker run -d \
          -e SPRING_DATASOURCE_URL=${{ secrets.EC2_DB_PRIVATE_IP }}:3306/db_inventario \
          -e SPRING_DATASOURCE_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
          --name inventario \
          --restart unless-stopped \
          ${{ secrets.ECR_REPO_URL_API_INVENTARIO }}:latest \
          && docker image prune -af'"
