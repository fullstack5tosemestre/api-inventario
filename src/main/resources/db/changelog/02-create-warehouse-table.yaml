databaseChangeLog:
  - changeSet:
      id: 02-create-warehouse-table
      author: smartlogix
      changes:
        - createTable:
            tableName: warehouse
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: branch_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_warehouse_branch
                    references: branch(id)
