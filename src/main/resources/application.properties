spring.application.name=inventario

# ==========================================
# Configuracion servidor
# ==========================================
server.port=8081

# ==========================================
# Base de datos MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/db_inventario?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — Liquibase gestiona el schema, JPA solo valida
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# ==========================================
# Liquibase (migraciones de base de datos)
# ==========================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# ==========================================
# Swagger UI
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
